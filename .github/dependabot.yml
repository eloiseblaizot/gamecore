# Mises à jour automatiques des dépendances, regroupées pour limiter le bruit.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    ignore:
      # TypeScript 7 (compilateur natif) n'est pas encore pris en charge par typescript-eslint.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Les types de Node suivent la version de Node visée (voir .nvmrc).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
