# Intégration continue : qualité, tests unitaires, build, tests de bout en bout, audit.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Moindre privilège : le workflow ne fait que lire le dépôt.
permissions:
  contents: read

# Une nouvelle poussée sur la même branche annule l'exécution précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, typage, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build

  e2e:
    name: Tests de bout en bout (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Vrai serveur LiveKit (mode développement) pour le test des webcams. Version figée et
      # archive vérifiée par sa somme SHA-256 publiée avec la version.
      - name: Serveur LiveKit de test
        env:
          LIVEKIT_VERSION: 1.13.9
        run: |
          archive="livekit_${LIVEKIT_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/livekit/livekit/releases/download/v${LIVEKIT_VERSION}"
          curl -sSLf -o "$RUNNER_TEMP/$archive" "$base/$archive"
          curl -sSLf -o "$RUNNER_TEMP/checksums.txt" "$base/checksums.txt"
          (cd "$RUNNER_TEMP" && grep " $archive\$" checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" livekit-server
          "$RUNNER_TEMP/livekit-server" --dev --bind 127.0.0.1 > "$RUNNER_TEMP/livekit.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:7880 > /dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/livekit.log"; exit 1
      - run: pnpm test:e2e
        env:
          LIVEKIT_URL: ws://127.0.0.1:7880
          # Clés publiques du mode développement de LiveKit (serveur local et éphémère).
          LIVEKIT_API_KEY: devkey
          LIVEKIT_API_SECRET: secret
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            ${{ runner.temp }}/livekit.log
          retention-days: 7

  audit:
    name: Audit des dépendances
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Échoue sur toute vulnérabilité connue de gravité haute ou critique.
      - run: pnpm audit --audit-level high
