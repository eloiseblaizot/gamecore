# Analyse statique de sécurité (CodeQL) : injections, XSS, traversées de chemin…
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # chaque lundi, pour les nouvelles règles

permissions:
  contents: read

jobs:
  analyze:
    name: Analyse JavaScript / TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
